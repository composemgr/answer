# nginx proxy address - http://172.17.0.1:9411

name: answer
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  answer:
    image: apache/answer:latest
    pull_policy: always
    container_name: answer-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://answer-app:80'
      - 'cloudflare.hostname=answer.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.answer-app.entrypoints=http'
      - 'traefik.http.routers.answer-app-secure.tls=true'
      - 'traefik.http.routers.answer-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.answer-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.answer-app.middlewares=answer-app-https-redirect'
      - 'traefik.http.routers.answer-app-secure.entrypoints=https'
      - 'traefik.http.routers.answer-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.answer-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.answer-app-secure.service=answer-app'
      - 'traefik.http.services.answer-app.loadbalancer.server.port=80'
    networks:
      - answer
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:9411:80"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: answer-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      AUTO_INSTALL: "false"
      DB_TYPE: mysql
      DB_USERNAME: ${DB_USER_NAME:-answer}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      DB_HOST: answer-db:3306
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-answer}
    volumes:
      - ./volumes/data/answer:/data
    depends_on:
      answer-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  answer-db:
    image: mysql:latest
    pull_policy: always
    container_name: answer-db
    hostname: answer-db
    restart: always
    logging: *default-logging
    networks:
      - answer
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: answer-db
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-answer}
      MYSQL_USER: ${DB_USER_NAME:-answer}
      MYSQL_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mysql/answer:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  answer:
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
