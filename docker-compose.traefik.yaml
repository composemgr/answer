name: answer
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: apache/answer:latest
    container_name: answer-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: answer-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      AUTO_INSTALL: 'false'
      DB_TYPE: mysql
      DB_HOST: answer-db
      DB_PORT: 3306
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-answer}
      DB_USERNAME: ${DB_USER_NAME:-answer}
      DB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/data/answer:/data'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.answer-app.entrypoints=http'
      - 'traefik.http.routers.answer-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.answer-app.middlewares=answer-app-https-redirect'
      - 'traefik.http.middlewares.answer-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.answer-app-secure.entrypoints=https'
      - 'traefik.http.routers.answer-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.answer-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.answer-app-secure.service=answer-app'
      - 'traefik.http.services.answer-app.loadbalancer.server.port=80'
    networks:
      - answer
      - traefik

  db:
    image: mysql:8.0
    container_name: answer-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: answer-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: answer-db
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-answer}
      MYSQL_USER: ${DB_USER_NAME:-answer}
      MYSQL_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/mysql/answer:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p$${MYSQL_ROOT_PASSWORD}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - answer

networks:
  answer:
    name: answer
    external: false
  traefik:
    external: true
